name: Full Stack Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

jobs:
  test_and_deploy:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Lint Backend Code
        run: |
          cd backend
          npm run lint

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend Code
        run: |
          cd frontend
          npm run lint

      - name: Check for skip in commit messages
        id: check_skip
        env:
          COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
        run: |
          echo "Commit messages: $COMMIT_MESSAGES"
          if [[ "$COMMIT_MESSAGES" == *"#skip"* ]]; then
            echo "skip=true" >> $GITHUB_ENV
          else
            echo "skip=false" >> $GITHUB_ENV
          fi

      - name: Prepare Deploy
        if: ${{ github.event_name == 'push' && env.skip != 'true' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build and Deploy FullStack
        if: ${{ github.event_name == 'push' && env.skip != 'true' }}
        run: |
          cd backend
          npm run deploy:full
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Bump version and push tag
        if: ${{ env.skip != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TYPE: patch
